<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHADA · 히어로 문 열기 (프로토타입)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#07111F;
  --paper:#F4F2EC;
  --muted:#A6B1C2;
  --cold:#5CE1E6;
  --peach:#FFC9A0;
  --pad:clamp(20px,5vw,64px);
  --section-y:clamp(96px,10vw,140px);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#07111F;--paper:#F4F2EC}}
:root[data-theme="dark"]{--night:#07111F;--paper:#F4F2EC}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--night)}
body{margin:0;background:var(--night);color:var(--paper);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-feature-settings:"tnum"}

.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:var(--pad);z-index:20;font-weight:700;letter-spacing:.08em;font-size:18px}
.proto-tag{position:fixed;top:calc(env(safe-area-inset-top,0px) + 22px);right:var(--pad);z-index:20;font-size:14px;color:var(--muted)}

.hero{position:relative;height:380vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--night)}
.world{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0}
.layer{position:absolute;display:block;user-select:none;-webkit-user-drag:none}
.outside{left:648px;top:87px;width:378px;height:658px;overflow:hidden;background:#cdb6a8}
.outside img{position:absolute;left:50%;top:0;height:100%;width:auto;transform:translateX(-50%) scale(1.06);transform-origin:50% 80%}
.dawn{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,214,180,0) 30%,rgba(255,201,160,.25));mix-blend-mode:screen;opacity:var(--open,0)}
.box{left:687px;top:426px;width:300px;height:300px;transform-origin:50% 90%}
.box-shadow{position:absolute;left:712px;top:668px;width:250px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(40,24,18,.45),transparent);opacity:var(--open,0)}
.room{left:0;top:0;width:1672px;height:941px;pointer-events:none}
.spill{position:absolute;left:0;top:0;width:1672px;height:941px;pointer-events:none;mix-blend-mode:screen;opacity:calc(var(--open,0) * .9)}
.spill .floor{position:absolute;inset:0;clip-path:polygon(648px 745px,1026px 745px,1330px 941px,350px 941px);background:linear-gradient(180deg,rgba(255,196,150,0) 78%,rgba(255,196,150,.7) 79.3%,rgba(255,196,150,0) 100%)}
.spill .halo{position:absolute;left:520px;top:20px;width:640px;height:820px;background:radial-gradient(ellipse 50% 50% at 50% 55%,rgba(255,205,165,.5),transparent 70%)}
.room-dim{position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 50% 45%,transparent 30%,rgba(4,8,18,.55));pointer-events:none;opacity:calc(1 - var(--open,0) * .55)}
.door-wrap{position:absolute;left:648px;top:87px;width:378px;height:658px;perspective:1300px;perspective-origin:80% 50%}
.door{position:absolute;inset:0;transform-origin:0 50%;transform:rotateY(calc(var(--door,0) * -1deg));will-change:transform;cursor:pointer;border:0;padding:0;background:transparent}
.door img{width:100%;height:100%;display:block;filter:brightness(calc(.45 + var(--glass,0) * .4))}
.door::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.45));opacity:calc(var(--door,0) / 110)}
.leak{position:absolute;left:1020px;top:87px;width:10px;height:658px;background:linear-gradient(180deg,rgba(255,210,170,.0),rgba(255,210,170,.9),rgba(255,210,170,.0));filter:blur(3px);opacity:0;transition:opacity .4s;pointer-events:none}
.stage.peek .leak{opacity:.9}
.stage.peek .door{transform:rotateY(-7deg);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}

.world-fade{position:absolute;left:0;top:-2px;width:1672px;height:220px;background:linear-gradient(180deg,var(--night),rgba(7,17,31,0));pointer-events:none;display:none}
.tag{position:absolute;left:837px;top:470px;transform:translate(-50%,-100%);white-space:nowrap;font-size:15px;line-height:1;padding:8px 12px 8px 10px;border-radius:999px;background:rgba(7,17,31,.78);color:var(--paper);display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cold);box-shadow:0 0 0 4px rgba(92,225,230,.18)}
.tag b{font-weight:500;color:var(--cold)}
.tag.on{opacity:1;transform:translate(-50%,-112%)}

.copy{position:absolute;right:var(--pad);top:50%;transform:translateY(-50%);width:min(520px,38vw);z-index:5}
.chip{display:inline-block;font-size:15px;font-weight:500;padding:6px 14px;border-radius:999px;background:var(--cold);color:#07111F;transform:rotate(-3deg);margin-bottom:22px}
h1{font-size:clamp(34px,3.6vw,54px);line-height:1.12;letter-spacing:-.015em;margin:0 0 20px;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:26em}
.copy .chip,.copy h1,.copy .sub{opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
.copy.on .chip{opacity:1;transform:rotate(-3deg)}
.copy.on h1{opacity:1;transform:none;transition-delay:.08s}
.copy.on .sub{opacity:1;transform:none;transition-delay:.16s}

.pre{position:absolute;right:var(--pad);top:50%;transform:translateY(-50%);width:min(520px,38vw);transition:opacity .4s}
.pre p{margin:0;font-size:clamp(22px,2.2vw,30px);line-height:1.45;font-weight:500}
.pre .clock{display:block;font-size:15px;color:var(--muted);margin-bottom:12px}
.pre.off{opacity:0}
.hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:15px;color:var(--muted);text-align:center;transition:opacity .4s;white-space:nowrap}
.hint.off{opacity:0}

.next{padding:var(--section-y) var(--pad);max-width:1280px;margin:0 auto}
.next h2{font-size:clamp(36px,4vw,56px);line-height:1.2;margin:0 0 16px;text-wrap:balance}
.next p{color:var(--muted);max-width:34em;margin:0}
footer{padding:28px var(--pad) 40px;border-top:1px solid rgba(244,242,236,.14);font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 24px;max-width:1280px;margin:0 auto}
footer strong{color:var(--paper);letter-spacing:.08em}

@media (max-width:900px){
  .copy,.pre{left:var(--pad);right:var(--pad);width:auto;top:calc(env(safe-area-inset-top,0px) + 72px);transform:none;max-width:none}
  .world-fade{display:block}
  h1{font-size:clamp(32px,8.6vw,44px);margin-bottom:12px}
  .chip{margin-bottom:14px}
  .sub{font-size:16px}
  .pre p{font-size:20px}
}
:focus-visible{outline:2px solid var(--cold);outline-offset:3px}
</style>
</head>

  <h2>사장님의 아침, 왜 이렇게 바쁠까요?</h2>
  <p>다음 섹션 자리예요. 히어로에서 결말을 먼저 보여주고, 여기서부터 "어제까지의 아침"으로 되감아 이야기를 시작합니다.</p>

<script>
(function(){
  var W=1672,H=941, DOOR_CX=837, DOOR_CY=416;
  var stage=document.getElementById('stage'), world=document.getElementById('world'), hero=document.getElementById('hero');
  var box=document.getElementById('box'), tag=document.getElementById('tag'), copy=document.getElementById('copy'), pre=document.getElementById('pre'), hint=document.getElementById('hint'), door=document.getElementById('door');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mobile=false;

  var vw=0,vh=0;
  function measure(){vw=stage.clientWidth;vh=stage.clientHeight;mobile=vw<=900}
  window.addEventListener('resize',measure); measure();
  function clamp(v){return Math.min(1,Math.max(0,v))}
  function ease(t){return 1-Math.pow(1-t,3)}
  function easeIO(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
  function lerp(a,b,t){return a+(b-a)*t}

  // camera: start wide, walk a few steps toward the door
  function place(walk){
    var s0,s1,fx0,fx1,fy0,fy1;
    if(mobile){
      s0=Math.min((vh*0.46)/658,(vw*0.74)/378); s1=Math.min(s0*1.28,(vw*0.94)/378);
      fx0=fx1=0.5; fy0=0.68; fy1=0.66;
    }else{
      s0=Math.max(vw/W,vh/H); s1=s0*1.32;
      fx0=0.5; fx1=0.4; fy0=0.5; fy1=0.5;
    }
    var s=lerp(s0,s1,walk), fx=lerp(fx0,fx1,walk), fy=lerp(fy0,fy1,walk);
    // footsteps: three gentle bobs while walking
    var bob=(walk>0&&walk<1)?Math.abs(Math.sin(walk*Math.PI*3))*-7:0;
    var tx=vw*fx-DOOR_CX*s, ty=vh*fy-DOOR_CY*s+bob;
    tx=Math.min(0,Math.max(vw-W*s,tx));
    if(!mobile) ty=Math.min(0,Math.max(vh-H*s,ty));
    world.style.transform='translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px) scale('+s.toFixed(4)+')';
  }

  var cur=0;
  function progress(){var r=hero.getBoundingClientRect(),span=r.height-window.innerHeight;return clamp(-r.top/span)}

  function frame(){
    var p = reduce ? 1 : progress();
    cur = reduce ? p : cur+(p-cur)*0.12;
    var walk=easeIO(clamp((cur-0.02)/0.36));
    place(walk);
    var openT=ease(clamp((cur-0.40)/0.30));
    world.style.setProperty('--door',(openT*104).toFixed(2));
    world.style.setProperty('--open',openT.toFixed(3));
    world.style.setProperty('--glass',clamp((cur-0.1)/0.28).toFixed(3));
    var bt=clamp((cur-0.6)/0.14), bounce=bt<1?Math.sin(bt*Math.PI)*(1-bt):0;
    box.style.transform='translateY('+((1-ease(bt))*-26 - bounce*10).toFixed(1)+'px) scale('+(0.94+0.06*ease(bt)).toFixed(3)+')';
    tag.classList.toggle('on',cur>0.7);
    copy.classList.toggle('on',cur>0.74);
    pre.classList.toggle('off',cur>0.2);
    hint.classList.toggle('off',cur>0.03);
    stage.classList.toggle('near',walk>0.98 && cur<0.41);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // PC: hover the handle side to peek, click to open
  if(!reduce && window.matchMedia('(hover: hover) and (pointer: fine)').matches){
    door.addEventListener('pointermove',function(e){
      var r=door.getBoundingClientRect(); stage.classList.toggle('peek',cur<0.4 && (e.clientX-r.left)/r.width>0.55);
    });
    door.addEventListener('pointerleave',function(){stage.classList.remove('peek')});
  }
  door.addEventListener('click',function(){
    stage.classList.remove('peek');
    var r=hero.getBoundingClientRect(), span=r.height-window.innerHeight, target=window.scrollY+r.top+span*Math.max(0.8,progress());
    window.scrollTo({top:target,behavior:reduce?'auto':'smooth'});
  });
})();
</script>
