<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHADA · 새벽 4시의 동네 (프로토타입)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#07162A;
  --dawn:#20406A;
  --paper:#F4F2EC;
  --muted:#93A4B8;
  --line:rgba(244,242,236,.14);
  --cold:#5CE1E6;
  --section-y:clamp(96px,10vw,140px);
  --pad:clamp(20px,5vw,64px);
  --sky:var(--night);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#07162A;--paper:#F4F2EC}}
:root[data-theme="dark"]{--night:#07162A;--paper:#F4F2EC}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--night)}
body{margin:0;background:var(--sky);color:var(--paper);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-feature-settings:"tnum"}

.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:var(--pad);z-index:10;font-weight:700;letter-spacing:.08em;font-size:18px}
.proto-tag{position:fixed;top:calc(env(safe-area-inset-top,0px) + 22px);right:var(--pad);z-index:10;font-size:14px;color:var(--muted)}

.intro,.outro{padding:var(--section-y) var(--pad);max-width:1280px;margin:0 auto}
.intro{min-height:88vh;display:flex;flex-direction:column;justify-content:center}
h2{font-size:clamp(36px,4vw,56px);line-height:1.2;letter-spacing:-.01em;margin:0 0 20px;font-weight:700;text-wrap:balance}
.lead{max-width:34em;color:var(--muted);margin:0}
.hint{margin-top:48px;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:10px}
.hint i{display:block;width:1px;height:40px;background:linear-gradient(var(--cold),transparent)}

/* scrolly */
.scrolly{position:relative;height:640vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:clamp(16px,3vw,48px);padding:72px var(--pad) 32px;overflow:hidden}
.scene{position:relative;display:flex;align-items:center;justify-content:center;perspective:1400px;min-height:0}
.tilt{width:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;will-change:transform}
.scene svg{display:block;width:100%;height:auto;max-height:calc(100vh - 140px);overflow:visible}
.glow{position:absolute;inset:auto 0 -20% 0;height:60%;background:radial-gradient(ellipse 60% 70% at 50% 100%,rgba(244,242,236,.10),transparent 70%);opacity:var(--dawnp,0);pointer-events:none}

.hud{position:absolute;left:0;top:0;display:flex;flex-direction:column;gap:2px}
.clock{font-size:clamp(40px,5vw,72px);line-height:1;letter-spacing:-.02em}
.hud-sub{font-size:15px;color:var(--muted)}
.temp{position:absolute;left:0;bottom:0;display:flex;align-items:baseline;gap:10px;font-size:15px;color:var(--muted)}
.temp b{font-weight:500;color:var(--cold);font-size:22px}

.stops{list-style:none;margin:0;padding:0;align-self:center;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.stop{display:grid;grid-template-columns:58px 1fr;gap:4px 14px;padding:12px 16px;border-left:2px solid var(--line);transition:border-color .3s,background-color .3s,opacity .3s;opacity:.38}
.stop .t{font-size:15px;color:var(--muted);padding-top:2px}
.stop .n{font-weight:500;font-size:17px;line-height:1.4}
.stop .d{grid-column:2;font-size:15px;color:var(--muted);line-height:1.5;max-height:0;overflow:hidden;transition:max-height .4s}
.stop.done{opacity:.75;border-color:rgba(92,225,230,.45)}
.stop.current{opacity:1;border-color:var(--cold);background:rgba(244,242,236,.04)}
.stop.current .d{max-height:60px}
.stop.done .t,.stop.current .t{color:var(--cold)}
.stop.final .n{font-weight:700}

.outro{text-align:left;padding-bottom:calc(var(--section-y) + 40px)}
.outro p{color:var(--muted);max-width:34em;margin:0}
footer{padding:28px var(--pad) 40px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 24px;max-width:1280px;margin:0 auto}
footer strong{color:var(--paper);letter-spacing:.08em}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;padding:64px var(--pad) 24px;gap:12px}
  .stops{align-self:end;min-height:96px;position:relative}
  .stop{display:none}
  .stop.current{display:grid}
  .scene svg{max-height:none}
  .hud{top:4px}
  .temp{bottom:4px}
}
@media (max-width:640px){
  body{font-size:16px}
  .clock{font-size:40px}
  .tilt{width:112%;flex:none;margin-left:-6%}
  .scene{justify-content:flex-start}
}
:focus-visible{outline:2px solid var(--cold);outline-offset:3px}
</style>
</head>
<body>
<div class="brand" aria-label="CHADA">CHADA</div>
<div class="proto-tag">4번 섹션 프로토타입</div>

<section class="intro">
  <h2>동네가 자는 동안,<br>냉장고가 채워져요.</h2>
  <p class="lead">CHADA 냉장차 한 대가 새벽 3시 30분에 출발해, 해 뜨기 전까지 동네 식당 여덟 곳을 차례로 돕니다.</p>
  <div class="hint"><i></i>스크롤하면 트럭이 출발해요</div>
</section>

    {p:[913,304],t:"05:34",n:"브런치 식당",d:"달걀과 우유, 입고 온도 2.8℃"}
  ];
  var NS="http://www.w3.org/2000/svg";
  var route=document.getElementById('route'), routeGlow=document.getElementById('routeGlow');
  var d="M"+pts.map(function(p){return p.join(' ')}).join(" L");
  route.setAttribute('d',d); routeGlow.setAttribute('d',d);
  var total=route.getTotalLength();
  [route,routeGlow].forEach(function(r){r.style.strokeDasharray=total;r.style.strokeDashoffset=total});

  // shop positions along path
  var samples=[];for(var i=0;i<=600;i++){var L=total*i/600,q=route.getPointAtLength(L);samples.push([L,q.x,q.y])}
  var lightsG=document.getElementById('lights'), list=document.getElementById('stops');
  var times=shops.map(function(s){return s.t});
  shops.forEach(function(s){var best=1e9,bl=0;samples.forEach(function(sm){var dd=Math.hypot(sm[1]-s.p[0],sm[2]-s.p[1]);if(dd<best){best=dd;bl=sm[0]}});s.len=bl;s.r=0});
  shops.sort(function(a,b){return a.len-b.len});
  shops.forEach(function(s,idx){
    s.t=times[idx];
    var c=document.createElementNS(NS,'circle');c.setAttribute('cx',s.p[0]);c.setAttribute('cy',s.p[1]);c.setAttribute('r',0);c.setAttribute('fill','url(#soft)');lightsG.appendChild(c);s.el=c;
    var li=document.createElement('li');li.className='stop';li.innerHTML='<span class="t mono">'+s.t+'</span><span class="n">'+s.n+'</span><span class="d">'+s.d+'</span>';list.appendChild(li);s.li=li;
  });
  var fin=document.createElement('li');fin.className='stop final';fin.innerHTML='<span class="t mono">05:40</span><span class="n">모든 가게 입고 완료</span><span class="d">나머지는 사장님이 셔터만 올리면 돼요.</span>';list.appendChild(fin);

  var truckImg=document.getElementById('truckImg'), truck=document.getElementById('truck'), flip=document.getElementById('truckFlip');
  var fullLit=document.getElementById('fullLit'), clock=document.getElementById('clock'), count=document.getElementById('count'), temp=document.getElementById('temp');
  var scrolly=document.getElementById('scrolly'), glow=document.getElementById('glow');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cur=0, target=0, full=0, lastImg='', lastFlip=0, dawn=0;

  function progress(){
    var r=scrolly.getBoundingClientRect(), span=r.height-window.innerHeight;
    return Math.min(1,Math.max(0,-r.top/span));
  }
  function mix(a,b,t){var pa=[parseInt(a.substr(1,2),16),parseInt(a.substr(3,2),16),parseInt(a.substr(5,2),16)],pb=[parseInt(b.substr(1,2),16),parseInt(b.substr(3,2),16),parseInt(b.substr(5,2),16)];return 'rgb('+pa.map(function(v,i){return Math.round(v+(pb[i]-v)*t)}).join(',')+')'}
  function pad(n){return (n<10?'0':'')+n}

  function frame(){
    var p=reduce?1:progress();
    target=Math.min(1,p/0.86)*total;
    cur=reduce?target:cur+(target-cur)*0.14;
    if(Math.abs(target-cur)<0.3)cur=target;

    // route
    var off=total-cur; route.style.strokeDashoffset=off; routeGlow.style.strokeDashoffset=off;

    // truck position + facing
    var pt=route.getPointAtLength(cur), a=route.getPointAtLength(Math.max(0,cur-6)), b=route.getPointAtLength(Math.min(total,cur+6));
    var dx=b.x-a.x, dy=b.y-a.y;
    if(Math.hypot(dx,dy)>0.5){
      var down=dy>0, img=down?'front':'rear';
      // front art faces down-left, rear art faces up-right
      var mirror = down ? (dx>0) : (dx<0);
      if(img!==lastImg){truckImg.setAttribute('href',IMG[img]);lastImg=img}
      var f=mirror?-1:1; if(f!==lastFlip){flip.setAttribute('transform','scale('+f+',1)');lastFlip=f}
    }
    truck.setAttribute('transform','translate('+pt.x.toFixed(1)+','+pt.y.toFixed(1)+')');
    truck.setAttribute('opacity',Math.min(1,Math.max(0,(total-cur)/(total*0.07))).toFixed(3));

    // lights
    var lit=0, currentIdx=-1;
    shops.forEach(function(s,i){
      var on=cur>=s.len-10; if(on){lit++;currentIdx=i}
      var tr=on?120:0; s.r=reduce?tr:s.r+(tr-s.r)*0.1; if(Math.abs(tr-s.r)<.5)s.r=tr;
      s.el.setAttribute('r',s.r.toFixed(1));
    });
    var endP=Math.max(0,(p-0.88)/0.12); var tf=Math.min(1,endP*1.4);
    full=reduce?tf:full+(tf-full)*0.1; fullLit.setAttribute('opacity',full.toFixed(3));
    dawn=Math.min(1,Math.max(0,(p-0.8)/0.2));
    document.body.style.setProperty('--sky',mix('#07162A','#20406A',dawn));
    glow.style.setProperty('--dawnp',dawn);

    // list state
    var finished=cur>=total-1;
    shops.forEach(function(s,i){s.li.classList.toggle('done',i<currentIdx||(finished&&i<=currentIdx));s.li.classList.toggle('current',i===currentIdx&&!finished)});
    fin.classList.toggle('current',finished);

    // clock 03:30 -> 05:40
    var mins=210+Math.round(130*cur/total); clock.textContent=pad(Math.floor(mins/60))+':'+pad(mins%60);
    count.textContent=cur<1?'출발 전, 불 켜진 가게 0곳':(finished?'불 켜진 가게 8곳, 배송 끝':'불 켜진 가게 '+lit+'곳');
    temp.textContent=(2.8+0.15*Math.sin(cur/90)).toFixed(1)+'℃';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // cursor tilt (PC only)
  var tilt=document.getElementById('tilt'), scene=document.getElementById('scene');
  if(!reduce && window.matchMedia('(hover: hover) and (pointer: fine)').matches){
    scene.addEventListener('pointermove',function(e){
      var r=scene.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      tilt.style.transform='rotateX('+(-y*7).toFixed(2)+'deg) rotateY('+(x*9).toFixed(2)+'deg)';
    });
    scene.addEventListener('pointerleave',function(){tilt.style.transform=''});
  }
})();
</script>
</body>
</html>
